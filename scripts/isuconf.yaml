remote:
  servers:
    - host: isu0
    - host: isu1
    - host: isu2
    - host: isu3
  user: isucon
local:
  config_root_path: ../etc
targets:
  - path: /etc/nginx/nginx.conf
    sudo: true
  - path: /etc/nginx/sites-enabled/isureal.conf
    sudo: true
  - path: /etc/mysql
    sudo: true
  - path: /etc/systemd/system/isureal-go.service
    sudo: true
  - path: /etc/systemd/system/pg2slowlog.service
    sudo: true
  - path: /etc/systemd/system/pprotein-agent.service
    sudo: true
  - path: /usr/lib/systemd/system/postgresql.service
    sudo: true
  - path: /usr/lib/systemd/system/nginx.service
    sudo: true
  - path: /etc/postgresql/16/main/postgresql.conf
    sudo: true
  - path: /etc/postgresql/16/main/pg_hba.conf
    sudo: true
  - path: /etc/ssh/sshd_config
    sudo: true
