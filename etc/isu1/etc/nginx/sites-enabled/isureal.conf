# 画像本体の置き場所(isu3)。往復が長いのでコネクションを使い回す
upstream image_store {
  server 192.168.4.10:80;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  location /api/ {
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:8080;
  }

  # アプリが署名と閲覧権限を確認したあと、X-Accel-Redirectで画像本体を返す
  # 初期データの画像は手元にキャッシュする(なければisu3から取得して保存)
  location /_img/initial/ {
    internal;
    root /home/isucon/image-cache;
    try_files $uri @img_initial_fetch;
  }

  location @img_initial_fetch {
    proxy_pass http://image_store;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_store on;
    proxy_store_access user:rw group:rw all:r;
    root /home/isucon/image-cache;
  }

  # ベンチ中に追加された画像も手元にキャッシュする(アップロードしたサーバーではアプリが書いておく)。
  # 初期化ではアプリが手元のruntime/を消し、他サーバーにもLISTEN/NOTIFYで消させる
  location /_img/runtime/ {
    internal;
    root /home/isucon/image-cache;
    try_files $uri @img_runtime_fetch;
  }

  location @img_runtime_fetch {
    proxy_pass http://image_store;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_store on;
    proxy_store_access user:rw group:rw all:r;
    root /home/isucon/image-cache;
  }

  location /debug/ {
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_set_header Host $host;
    proxy_pass http://localhost:8383;
  }

  location / {
    try_files $uri /index.html;
  }
}
