# 画像本体の置き場所(isu3)。往復が長いのでコネクションを使い回す
upstream image_store {
  server 192.168.4.10:80;
  keepalive 32;
}

# ベンチ中に追加された画像を持っているサーバー(アップロードしたサーバー)。落ちていればisu3から取得する
upstream img_origin_asia {
  server 192.168.1.10:80;
  server 192.168.4.10:80 backup;
  keepalive 16;
}
upstream img_origin_europe {
  server 192.168.2.10:80;
  server 192.168.4.10:80 backup;
  keepalive 16;
}
upstream img_origin_america {
  server 192.168.3.10:80;
  server 192.168.4.10:80 backup;
  keepalive 16;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  location /api/ {
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:8080;
  }

  # アプリが署名と閲覧権限を確認したあと、X-Accel-Redirectで画像本体を返す
  # 初期データの画像は手元にキャッシュする(なければisu3から取得して保存)
  location /_img/initial/ {
    internal;
    root /home/isucon/image-cache;
    try_files $uri @img_initial_fetch;
  }

  location @img_initial_fetch {
    proxy_pass http://image_store;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_store on;
    proxy_store_access user:rw group:rw all:r;
    root /home/isucon/image-cache;
  }

  # ベンチ中に追加された画像も手元にキャッシュする(アップロードしたサーバーではアプリが書いておく)。
  # 初期化ではアプリが手元のruntime/を消し、他サーバーにもLISTEN/NOTIFYで消させる
  location /_img/runtime/ {
    internal;
    root /home/isucon/image-cache;
    try_files $uri @img_runtime_fetch;
  }

  location @img_runtime_fetch {
    proxy_pass http://image_store;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_store on;
    proxy_store_access user:rw group:rw all:r;
    root /home/isucon/image-cache;
  }

  # 別のリージョンのサーバーが持っている画像。手元になければ、そのサーバー(落ちていればisu3)から取得して保存する
  location ~ "^/_img/runtime-from/(asia|europe|america)/([0-9a-f]{2}/[0-9a-f-]{36}\.jpg)$" {
    internal;
    set $img_origin $1;
    set $img_rel $2;
    root /home/isucon/image-cache;
    try_files /_img/runtime/$img_rel @img_runtime_from_origin;
  }

  location @img_runtime_from_origin {
    proxy_pass http://img_origin_$img_origin/_img_origin/runtime/$img_rel;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_next_upstream error timeout http_404 http_502 http_503;
    proxy_store /home/isucon/image-cache/_img/runtime/$img_rel;
    proxy_store_access user:rw group:rw all:r;
  }

  # 他のサーバーのnginxに、このサーバーが持っている画像を渡す。
  # ルーター経由の外部からのリクエスト(送信元 192.168.10.10)は通さず、サーバー4台のIPだけを許可する
  location /_img_origin/ {
    allow 192.168.1.10;
    allow 192.168.2.10;
    allow 192.168.3.10;
    allow 192.168.4.10;
    deny all;
    alias /home/isucon/image-cache/_img/;
  }

  location /debug/ {
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_set_header Host $host;
    proxy_pass http://localhost:8383;
  }

  location / {
    try_files $uri /index.html;
  }
}
