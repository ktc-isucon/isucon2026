# isu3: 画像本体の置き場所。isu0〜2のアプリとnginxだけが使う
server {
  listen 80 default_server;
  server_name _;

  allow 192.168.0.0/16;
  allow 127.0.0.1;
  deny all;

  client_max_body_size 32m;

  # アプリからの書き込み(PUT)と削除(DELETE)。初期化では /images/runtime/ をまとめて消す
  location /images/ {
    root /home/isucon;
    dav_methods PUT DELETE;
    create_full_put_path on;
    dav_access user:rw group:rw all:r;
  }

  # isu0〜2のnginxからの読み出し
  location /_img/ {
    alias /home/isucon/images/;
  }

  location / {
    return 404;
  }
}
